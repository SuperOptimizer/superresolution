# Real-run config for the L4 (24GB) on the EC2 instance.
# Trains from a locally-cached ROI cube (scripts/cache_roi.py) for throughput,
# syncing checkpoints to S3 since /mnt/data is ephemeral.
{
  "seed": 0,

  "data": {
    "source": "cached",
    "cache_path": "/mnt/data/roi.npy",
    "bucket": "vesuvius-challenge-open-data",
    "scroll": "PHerc0500P2",
    "zarr": "volumes/20250526151718-2.215um-0.4m-111keV-masked.zarr",
    "level": 0,
    "local_path": null,

    "patch": [64, 64, 64],
    "occupancy_min": 0.5,
    "norm_low_pct": 0.5,
    "norm_high_pct": 99.5,
    "augment": true,
    "augment_inplane_only": false
  },

  "degradation": {
    "sigma_xy": [0.6, 1.3],
    "sigma_z":  [0.9, 1.8],
    "noise_sigma": [0.005, 0.03],
    "noise_color": [0.0, 1.2],
    "shift": [-0.5, 0.5],
    "intensity_gain": [0.9, 1.1],
    "intensity_bias": [-0.03, 0.03],
    "u8_quantize": true
  },

  "model": {
    "in_ch": 1,
    "base_width": 32,
    "levels": 3,
    "blocks_per_level": 2,
    "residual": true,
    "grad_checkpoint": false
  },

  "loss": {
    "charbonnier_eps": 1.0e-3,
    "mask_air": true,
    "data_consistency_weight": 0.1
  },

  "train": {
    "steps": 1500,
    "batch_size": 8,
    "lr": 2.0e-4,
    "weight_decay": 1.0e-4,
    "num_workers": 6,
    "prefetch_factor": 4,
    "grad_clip": 1.0,
    "gpu_degrade": true,
    "compile": "max-autotune",
    "compile_dynamic": false,
    "compile_fullgraph": true,
    "log_every": 25,
    "val_every": 250,
    "ckpt_every": 250,
    "ckpt_dir": "/mnt/data/checkpoints/l4",
    "s3_sync": "s3://YOUR_BUCKET/YOUR_PREFIX/superres/runs/l4",
    "amp_bf16": true
  },

  "infer": {
    "window": [256, 256, 256],
    "overlap": 32,
    "occupancy_skip": true,
    "amp_bf16": true
  }
}
