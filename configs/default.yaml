# Vesuvius x1 restoration -- default config (real-data scale).
# JSON-compatible YAML so it parses with or without pyyaml.
# All degradation parameters are CENTERED on measured values with a MODEST spread
# (anchor + randomize). Re-measure per dataset with superres.degradation.measure_psf_from_edge.

{
  "seed": 0,

  "data": {
    # S3 source. Set "local_path" instead to read a downloaded zarr from disk.
    "source": "s3",
    "bucket": "vesuvius-challenge-open-data",
    "scroll": "PHerc0500P2",
    "zarr": "volumes/20250526151718-2.215um-0.4m-111keV-masked.zarr",
    "level": 0,                  # multiscale level (0 = finest = ground truth)
    "local_path": null,          # e.g. "/data/PHerc0500P2/...zarr" to bypass S3

    "patch": [128, 128, 128],    # clean patch size (z, y, x); == zarr chunk size
    "occupancy_min": 0.5,        # reject patches with < this nonzero fraction (skip air)
    "norm_low_pct": 0.5,         # robust normalization clip percentiles
    "norm_high_pct": 99.5,
    "augment": true,
    "augment_inplane_only": false  # full 48-group is safe: we degrade AFTER augment
  },

  # The load-bearing piece. Ranges are (low, high), sampled uniformly per patch.
  # sigma_* are Gaussian-PSF std-devs in voxels; z and xy are independent (anisotropy).
  "degradation": {
    "sigma_xy": [0.6, 1.3],
    "sigma_z":  [0.9, 1.8],      # CT through-plane PSF is typically wider than in-plane
    "noise_sigma": [0.005, 0.03],   # in normalized [0,1] units
    "noise_color": [0.0, 1.2],      # gaussian smoothing of the noise field (0 = white)
    "shift": [-0.5, 0.5],           # sub-voxel grid-phase jitter (voxels)
    "intensity_gain": [0.9, 1.1],
    "intensity_bias": [-0.03, 0.03],
    "u8_quantize": true
  },

  "model": {
    "in_ch": 1,
    "base_width": 32,
    "levels": 3,
    "blocks_per_level": 2,
    "residual": true            # out = in + net(in)
  },

  "loss": {
    "charbonnier_eps": 1.0e-3,
    "mask_air": true,           # exclude background from the loss
    "data_consistency_weight": 0.1   # re-degrade prediction, match input
  },

  "train": {
    "steps": 100000,
    "batch_size": 4,
    "lr": 2.0e-4,
    "weight_decay": 1.0e-4,
    "num_workers": 8,
    "val_every": 1000,
    "ckpt_every": 2000,
    "ckpt_dir": "checkpoints",
    "amp_bf16": true            # only used when CUDA is available; ignored on CPU
  },

  "infer": {
    "window": [256, 256, 256],  # inference tile (can exceed train patch; no grads)
    "overlap": 32,              # cosine-feather halo; >= PSF support
    "occupancy_skip": true,     # skip all-zero chunks (no read, no compute)
    "amp_bf16": true
  }
}
